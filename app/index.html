<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLogistics AI - 물류 거점 최적화</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css">
    
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey={kakao_key}&libraries=services"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>🚚 GeoLogistics AI</h2>
        <p class="description">데이터 기반 스마트 물류 거점 최적화</p>
        
        <div class="control-group">
            <label for="csv-file">📂  데이터 파일 업로드 (.csv)</label>
            <div style="margin-bottom: 5px; font-size: 0.85rem;">
                <a href="/static/sample_data.csv" download style="color:#3498db; text-decoration:none;">
                    ⬇️ 테스트용 샘플 데이터 받기
                </a>
            </div>
            <input type="file" id="csv-file" accept=".csv" onchange="loadPreview()">
        </div>
        
        <div class="mb-4 relative">
            <label class="block text-gray-700 text-sm font-bold mb-2">업종 선택</label>
            
            <button id="category-btn" onclick="toggleDropdown('category-dropdown')" 
                class="w-full bg-white border border-gray-300 text-gray-700 py-2 px-3 rounded shadow leading-tight focus:outline-none focus:shadow-outline text-left flex justify-between items-center">
                <span>선택된 업종 없음</span>
                <span class="text-xs">▼</span>
            </button>

            <div id="category-dropdown" class="hidden absolute z-50 mt-1 w-full bg-white border border-gray-300 rounded shadow-lg max-h-60 overflow-y-auto">
                <div id="category-list" class="p-2">
                    <div class="text-gray-400 text-sm">파일을 먼저 업로드하세요</div>
                </div>
            </div>
        </div>

        <div class="mb-4 relative">
            <label class="block text-gray-700 text-sm font-bold mb-2 ">지역 선택</label>
            
            <button id="region-btn" onclick="toggleDropdown('region-dropdown')" 
                class="w-full bg-white border border-gray-300 text-gray-700 py-2 px-3 rounded shadow leading-tight focus:outline-none focus:shadow-outline text-left flex justify-between items-center">
                <span>선택된 지역 없음</span>
                <span class="text-xs">▼</span>
            </button>

            <div id="region-dropdown" class="hidden absolute z-50 mt-1 w-full bg-white border border-gray-300 rounded shadow-lg max-h-60 overflow-y-auto">
                <div id="region-list" class="p-2">
                    <div class="text-gray-400 text-sm">파일을 먼저 업로드하세요</div>
                </div>
            </div>
        </div>

        <div class="control-group">
            <label for="k-value">🏢  설치할 거점 개수 (K)</label>
            <input type="number" id="k-value" value="3" min="1" max="10">
        </div>
        
        <button onclick="runAnalysis()">🚀 분석 시작</button>
        <button class="btn-secondary" onclick="runElbow()">📈 최적 K 찾기 (Elbow)</button>
        
        <button class="btn-secondary" id="download-btn" type="button" hidden onclick="downloadResults()">
            📥 결과 저장 (CSV)
        </button>

        <div id="result-stats">
            <div id="status-text">파일을 선택하고 분석 버튼을 누르세요.</div>
            <div id="loading-spinner" class="spinner hidden"></div>
        </div>
    </div>
    
    <div id="map" class="map-container"></div>
</div>

<div id="elbowModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 style="margin-top:0;">📉 최적의 K값 찾기 (Elbow Method)</h3>
        <p style="font-size:0.9rem; color:#666;">그래프가 팔꿈치처럼 꺾이는 지점이 최적의 개수입니다.</p>
        <canvas id="elbowChart"></canvas>
    </div>
</div>

<div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 9999; align-items: center; justify-content: center;">
    <div style="background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;">
        <svg style="animation: spin 1s linear infinite; width: 50px; height: 50px; margin: 0 auto 15px auto; color: #3b82f6;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        
        <p id="loading-message" style="font-size: 18px; font-weight: bold; color: #333; margin: 0;">데이터 분석 중...</p>
        <p style="font-size: 14px; color: #666; margin-top: 5px;">잠시만 기다려주세요.</p>
    </div>
</div>

<style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>

<script src="/static/script.js"></script>

</body>
</html>
