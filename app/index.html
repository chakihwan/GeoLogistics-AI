<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLogistics AI - 물류 거점 최적화</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css">
    
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey={kakao_key}&libraries=services"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>🚚 GeoLogistics AI</h2>
        <p class="description">데이터 기반 스마트 물류 거점 최적화</p>
        
        <div class="control-group">
            <label for="csv-file">📂 1. 데이터 파일 업로드 (.csv)</label>
            <input type="file" id="csv-file" accept=".csv">
        </div>

        <div class="control-group">
            <label for="k-value">🏢 2. 설치할 거점 개수 (K)</label>
            <input type="number" id="k-value" value="3" min="1" max="10">
        </div>
        
        <button onclick="runAnalysis()">🚀 분석 시작</button>
        
        <div id="result-stats">
            <div id="status-text">파일을 선택하고 분석 버튼을 누르세요.</div>
            <div id="loading-spinner" class="spinner hidden"></div>
        </div>
    </div>
    
    <div id="map" class="map-container"></div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
