<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLogistics AI - 물류 거점 최적화</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        
        /* 전체 레이아웃: 왼쪽 컨트롤패널, 오른쪽 지도 */
        .container { display: flex; height: 100vh; }
        
        /* 컨트롤 패널 스타일 */
        .sidebar {
            width: 300px;
            padding: 20px;
            background: #f8f9fa;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .map-container { flex-grow: 1; }
        
        /* 버튼 및 입력창 스타일 */
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button {
            width: 100%; padding: 10px;
            background-color: #3b5bdb; color: white;
            border: none; cursor: pointer; font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #2c42a5; }
        
        /* 결과 통계 박스 */
        #result-stats {
            margin-top: 20px; padding: 10px;
            background: white; border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
    
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey={kakao_key}"></script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>🚚 물류 거점 최적화</h2>
        <p>CSV 파일을 업로드하여 분석합니다.</p>
        
        <div class="control-group">
            <label for="csv-file">1. 데이터 파일 업로드 (CSV)</label>
            <input type="file" id="csv-file" accept=".csv">
        </div>

        <div class="control-group">
            <label for="k-value">2. 설치할 창고 개수 (K)</label>
            <input type="number" id="k-value" value="3" min="1" max="10">
        </div>
        
        <button onclick="runAnalysis()">📍 분석 실행</button>
        
        <div id="result-stats">
            <p>파일을 선택하고 분석 버튼을 누르세요.</p>
        </div>
    </div>
    
    <div id="map" class="map-container"></div>
</div>

<script>
    var map;
    var markers = []; 

    function initMap() {
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.498095, 127.027610),
            level: 6 // 지도를 조금 더 넓게 보이게 조정
        };
        map = new kakao.maps.Map(container, options);
    }

    window.onload = initMap;

    // ⚠️ 변경된 분석 함수
    async function runAnalysis() {
        const fileInput = document.getElementById('csv-file');
        const kValue = document.getElementById('k-value').value;
        const resultDiv = document.getElementById('result-stats');

        // 1. 파일 선택 여부 확인
        if (fileInput.files.length === 0) {
            alert("CSV 파일을 먼저 선택해주세요!");
            return;
        }

        resultDiv.innerHTML = "⏳ 파일 업로드 및 분석 중...";

        // 2. FormData 객체 생성 (파일 전송용)
        const formData = new FormData();
        formData.append('file', fileInput.files[0]); // 파일 담기
        formData.append('k', kValue);               // K값 담기

        try {
            // 3. 백엔드로 전송 (Content-Type 헤더는 fetch가 알아서 설정하므로 생략)
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData 
            });

            if (!response.ok) {
                const err = await response.json();
                alert("에러: " + err.detail);
                resultDiv.innerHTML = "❌ 분석 실패";
                return;
            }

            const data = await response.json();
            drawResult(data);
            resultDiv.innerHTML = `✅ 분석 완료!<br>총 ${data.points.length}개 지점<br>${data.centers.length}개 거점 추천됨`;

        } catch (error) {
            console.error(error);
            alert("서버 연결 실패!");
            resultDiv.innerHTML = "❌ 서버 오류";
        }
    }

    // ... (drawResult 함수는 기존과 동일하게 유지) ...
    function drawResult(data) {
        // 기존 마커 제거 코드...
        for (var i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
        const colors = ['#FF0000', '#0000FF', '#008000', '#FFA500', '#800080']; 

        // 점 찍기
        data.points.forEach(point => {
            var circle = new kakao.maps.Circle({
                center : new kakao.maps.LatLng(point.lat, point.lon),
                radius: 15, strokeWeight: 1, strokeColor: colors[point.cluster % colors.length],
                strokeOpacity: 0.8, fillColor: colors[point.cluster % colors.length], fillOpacity: 0.6
            });
            circle.setMap(map);
            markers.push(circle);
        });

        // 거점 찍기
        var imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png"; 
        data.centers.forEach(center => {
            var imageSize = new kakao.maps.Size(35, 50); 
            var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize); 
            var marker = new kakao.maps.Marker({
                map: map, position: new kakao.maps.LatLng(center.lat, center.lon),
                title: "추천 거점 " + center.cluster_id, image: markerImage
            });
            markers.push(marker);
        });
    }
</script>
</body>
</html>
