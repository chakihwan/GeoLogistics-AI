<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLogistics AI - 물류 거점 최적화</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css">
    
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey={kakao_key}&libraries=services"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>🚚 GeoLogistics AI</h2>
        <p class="description">데이터 기반 스마트 물류 거점 최적화</p>
        
        <div class="control-group">
            <label for="csv-file">📂 1. 데이터 파일 업로드 (.csv)</label>
            <input type="file" id="csv-file" accept=".csv" onchange="loadPreview()">
        </div>

        <div class="control-group">
            <label for="category-select">🍕 업종 필터 (선택)</label>
            <select id="category-select" disabled style="width:100%; padding:10px; border-radius:6px; border:1px solid #ddd;">
                <option value="all">전체 업종</option>
            </select>
        </div>

        <div class="control-group">
            <label for="region-select">Map 🗺️ 지역 필터 (선택)</label>
            <select id="region-select" disabled style="width:100%; padding:10px; border-radius:6px; border:1px solid #ddd;">
                <option value="all">전체 지역</option>
            </select>
        </div>

        <div class="control-group">
            <label for="k-value">🏢 2. 설치할 거점 개수 (K)</label>
            <input type="number" id="k-value" value="3" min="1" max="10">
        </div>
        
        <button onclick="runAnalysis()">🚀 분석 시작</button>
        <button class="btn-secondary" onclick="runElbow()">📈 최적 K 찾기 (Elbow)</button>
        
        <div id="result-stats">
            <div id="status-text">파일을 선택하고 분석 버튼을 누르세요.</div>
            <div id="loading-spinner" class="spinner hidden"></div>
        </div>
    </div>
    
    <div id="map" class="map-container"></div>
</div>

<div id="elbowModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 style="margin-top:0;">📉 최적의 K값 찾기 (Elbow Method)</h3>
        <p style="font-size:0.9rem; color:#666;">그래프가 팔꿈치처럼 꺾이는 지점이 최적의 개수입니다.</p>
        <canvas id="elbowChart"></canvas>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
